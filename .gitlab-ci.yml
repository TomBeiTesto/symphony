include:
  - project: 'infrastructure/ci-common'
    file: 'pipelines/service.yml'
    ref: 11.3.6

variables:
  BUILD_TYPE: "elixir"
  DEPLOYMENT_TYPE: "terraform-only"
  TERRAFORM_PLAN_APPROVAL_ENABLED: "false"
  DEPENDENCY_CHECK_ANALYZE: "false"
  SONARQUBE_ANALYSIS: "false"
  SONARQUBE_QUALITY_GATE: "false"

detect-missmatch-with-ci-common-terragrunt.hcl:
  allow_failure: true

.enable-environments:
  europe-testing: "false"
  europe-dev: "false"
  europe-int: "false"
  global-int: "false"
  europe-qs: "false"
  europe-prod: "false"
  apac-prod: "false"
  america-prod: "false"
  global-prod: "false"

# =============================================================================
# Elixir Build & Test
# =============================================================================

build-elixir:
  stage: build
  tags:
    - default
    - k8s
    - ${RUNNER_CLUSTER}
  image: docker-hub.testo.dev/elixir:1.19-otp-28
  needs: []
  variables:
    MIX_ENV: test
  script:
    - cd elixir
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
    - mix compile --warnings-as-errors
  artifacts:
    paths:
      - elixir/deps/
      - elixir/_build/
    expire_in: 1 day
  cache:
    key: "${CI_COMMIT_REF_SLUG}-mix"
    paths:
      - elixir/deps/
      - elixir/_build/
  rules:
    - !reference [.disable-job-for-custom-schedules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test-elixir:
  stage: test
  tags:
    - default
    - k8s
    - ${RUNNER_CLUSTER}
  image: docker-hub.testo.dev/elixir:1.19-otp-28
  needs:
    - job: build-elixir
      artifacts: true
  variables:
    MIX_ENV: test
  script:
    - cd elixir
    - mix local.hex --force
    - mix test --cover
  rules:
    - !reference [.disable-job-for-custom-schedules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint-elixir:
  stage: test
  tags:
    - default
    - k8s
    - ${RUNNER_CLUSTER}
  image: docker-hub.testo.dev/elixir:1.19-otp-28
  needs:
    - job: build-elixir
      artifacts: true
  variables:
    MIX_ENV: test
  script:
    - cd elixir
    - mix local.hex --force
    - mix format --check-formatted
    - mix credo --strict
  allow_failure: true
  rules:
    - !reference [.disable-job-for-custom-schedules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Playwright E2E Tests
# =============================================================================

e2e-tests:
  stage: test
  tags:
    - default
    - k8s
    - ${RUNNER_CLUSTER}
  image: docker-hub.testo.dev/elixir:1.19-otp-28
  needs:
    - job: build-elixir
      artifacts: true
  variables:
    MIX_ENV: dev
    SYMPHONY_BASE_URL: "http://127.0.0.1:4545"
  before_script:
    # Install Node.js and Playwright dependencies
    - apt-get update -qq && apt-get install -y -qq nodejs npm curl
    - cd elixir/test/e2e
    - npm ci
    - npx playwright install --with-deps chromium
    - cd ../../..
  script:
    # Start the E2E test server in the background
    - cd elixir
    - mix local.hex --force
    - mix run test/e2e/test_server.exs &
    - SERVER_PID=$!
    # Wait for server to be ready (up to 30s)
    - |
      for i in $(seq 1 30); do
        if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4545/ 2>/dev/null | grep -q 200; then
          echo "Server ready"
          break
        fi
        sleep 1
      done
    # Run Playwright tests (screenshots excluded by default config)
    - cd test/e2e
    - npx playwright test
    # Cleanup
    - kill $SERVER_PID 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - elixir/test/e2e/test-results/
    expire_in: 7 days
  rules:
    - !reference [.disable-job-for-custom-schedules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
